name: Prisma Migrate (Preview Branch)

on:
  pull_request:
    paths:
      - "prisma/**"
  workflow_dispatch:
    inputs:
      neon_branch:
        description: "Neon branch to migrate, e.g. preview/staging. Created from the parent if it doesn't exist."
        required: true
      dry_run:
        description: "Only report pending migrations, don't apply them"
        type: boolean
        default: false

jobs:
  migrate-preview:
    name: Run Prisma Migrations on Neon Branch
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "yarn"

      - name: Get Neon branch database URL
        id: neon
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_name: ${{ inputs.neon_branch || format('preview/{0}', github.head_ref) }}
          database: verceldb
          api_key: ${{ secrets.NEON_API_KEY }}

      - run: yarn install --frozen-lockfile

      # Both steps use the direct endpoint, not the pooler. Prisma guards migrate
      # with a session-scoped advisory lock, and PgBouncer returns the connection
      # to the pool while that lock is still held, so a later run blocks on a lock
      # nothing will release and fails with P1002.
      - name: Show pending migrations
        run: npx prisma migrate status || true
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}

      - name: Apply migrations to preview branch database
        if: ${{ !inputs.dry_run }}
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
