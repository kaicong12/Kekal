services:
  postgres:
    image: postgres:17
    container_name: kekal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: kekal
    ports:
      - "5433:5432"
    volumes:
      - kekal-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kekal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kekal-pgdata:
